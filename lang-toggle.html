<script>
document.addEventListener("DOMContentLoaded", function () {
  var path = window.location.pathname;
  var inEs = path.indexOf('/es/') !== -1 || /\/es$/.test(path);

  var navLabels = {
    "Home": "Inicio",
    "Research": "Investigación",
    "Publications": "Publicaciones",
    "Teaching": "Docencia",
    "Vitae": "CV"
  };

  if (inEs) {
    document.documentElement.setAttribute('lang', 'es');

    document.querySelectorAll('.navbar-nav .menu-text').forEach(function (el) {
      var en = el.textContent.trim();
      if (navLabels[en]) {
        el.textContent = navLabels[en];
      }
    });

    var footerRight = document.querySelector('.nav-footer-right');
    if (footerRight) {
      footerRight.innerHTML = footerRight.innerHTML.replace('Built with', 'Creado con');
    }
  }

  var file = path.substring(path.lastIndexOf('/') + 1) || 'index.html';
  var target = inEs ? '../' + file : 'es/' + file;
  var label = inEs ? 'EN' : 'ES';

  var navRight = document.querySelector('.navbar-nav.navbar-nav-scroll.ms-auto');
  if (navRight) {
    var li = document.createElement('li');
    li.className = 'nav-item compact';
    var a = document.createElement('a');
    a.className = 'nav-link';
    a.href = target;
    a.textContent = label;
    a.setAttribute('aria-label', inEs ? 'View in English' : 'Ver en español');
    li.appendChild(a);
    navRight.insertBefore(li, navRight.firstChild);
  }
});
</script>
