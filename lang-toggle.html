<script>
document.addEventListener("DOMContentLoaded", function () {
  var path = window.location.pathname;
  var inEs = path.indexOf('/es/') !== -1 || /\/es$/.test(path);

  var navLabels = {
    "Home": "Inicio",
    "Research": "Investigación",
    "Publications": "Publicaciones",
    "Teaching": "Docencia",
    "Vitae": "CV"
  };

  var pageFile = {
    "Home": "index.html",
    "Research": "research.html",
    "Publications": "publications.html",
    "Teaching": "teaching.html",
    "Vitae": "vitae.html"
  };

  if (inEs) {
    document.documentElement.setAttribute('lang', 'es');

    // quarto-nav.js (loaded earlier in <head>) already ran by this point and
    // rewrites nav-link hrefs to absolute URLs pointing at the English root
    // pages, for its own active-page bookkeeping. Identify each link by its
    // (still-English) label rather than trusting its href, and set the
    // href to the sibling page in es/ as the last word on the matter.
    document.querySelectorAll('.navbar-nav.navbar-nav-scroll.me-auto .nav-link').forEach(function (a) {
      var span = a.querySelector('.menu-text');
      if (!span) return;
      var en = span.textContent.trim();
      if (pageFile[en]) {
        a.setAttribute('href', pageFile[en]);
      }
      if (navLabels[en]) {
        span.textContent = navLabels[en];
      }
    });

    var brand = document.querySelector('.navbar-brand');
    if (brand) {
      brand.setAttribute('href', 'index.html');
    }

    var footerRight = document.querySelector('.nav-footer-right');
    if (footerRight) {
      footerRight.innerHTML = footerRight.innerHTML.replace('Built with', 'Creado con');
    }
  }

  var file = path.substring(path.lastIndexOf('/') + 1) || 'index.html';
  var target = inEs ? '../' + file : 'es/' + file;
  var label = inEs ? 'EN' : 'ES';

  var navRight = document.querySelector('.navbar-nav.navbar-nav-scroll.ms-auto');
  if (navRight) {
    var li = document.createElement('li');
    li.className = 'nav-item compact';
    var a = document.createElement('a');
    a.className = 'nav-link';
    a.href = target;
    a.textContent = label;
    a.setAttribute('aria-label', inEs ? 'View in English' : 'Ver en español');
    li.appendChild(a);
    navRight.insertBefore(li, navRight.firstChild);
  }
});
</script>
